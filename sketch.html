<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Plano{% if folio %} {{ folio }}{% endif %} | QuantixBuilds</title>
  <script src="{{ url_for('static', filename='fabric.min.js') }}"></script>
  <style>
    :root {
      --navy:#19385f; --navy-deep:#0b1f3a; --blue:#0d47a1; --blue-mid:#2d70ad;
      --gold:#dba72b; --ink:#1d2b3b; --muted:#627083; --line:#d7e0e8;
      --paper:#fff; --canvas:#eef2f6; --soft:#edf5fb;
    }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; background:var(--canvas); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    body { display:flex; min-height:100%; }
    .qb-rail {
      width:84px; flex:0 0 84px; background:var(--navy-deep); color:#dbe7f3;
      display:flex; flex-direction:column; align-items:center; padding:12px 8px 16px; z-index:6;
    }
    .qb-rail a.logo { color:#fff; font-weight:800; font-size:.72rem; letter-spacing:.04em; text-decoration:none; text-align:center; margin-bottom:14px; line-height:1.2; }
    .qb-rail .grp { width:100%; display:flex; flex-direction:column; gap:4px; margin:8px 0; }
    .qb-rail .grp small { display:block; text-align:center; font-size:.58rem; letter-spacing:.08em; text-transform:uppercase; color:#8aa0b8; margin:2px 0 4px; }
    .qb-rail button {
      width:100%; border:0; background:transparent; color:#dbe7f3; border-radius:12px;
      padding:8px 4px 7px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
      font-size:.62rem; font-weight:700; line-height:1.15;
    }
    .qb-rail button svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .qb-rail button:hover { background:rgba(255,255,255,.08); }
    .qb-rail button.is-on { background:var(--blue); color:#fff; }
    .qb-shell { flex:1; min-width:0; display:flex; flex-direction:column; }
    .qb-top {
      height:56px; background:var(--paper); border-bottom:1px solid var(--line);
      display:flex; align-items:center; gap:14px; padding:0 16px; z-index:5;
    }
    .qb-top strong { color:var(--navy); }
    .qb-top .meta { color:var(--muted); font-size:.88rem; }
    .qb-top .grow { flex:1; }
    .qb-top .status { font-size:.82rem; color:var(--muted); }
    .qb-top .status.ok { color:#27834e; }
    .qb-top .status.err { color:#b91c1c; }
    .qb-top .btn {
      min-height:36px; border:1px solid var(--line); background:#fff; color:var(--navy);
      border-radius:10px; padding:0 12px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center;
    }
    .qb-top .btn-primary { background:var(--blue); border-color:var(--blue); color:#fff; }
    .qb-top .btn-primary:disabled { opacity:.6; cursor:wait; }
    .qb-stage { flex:1; position:relative; min-height:0; isolation:isolate; }
    #sketch-board {
      position:absolute; inset:0; z-index:1; background:var(--canvas);
      pointer-events:auto; touch-action:none; user-select:none; overflow:hidden;
    }
    #sketch-board.is-draw { cursor:crosshair; }
    #sketch-board.is-note { cursor:text; }
    #sketch-board.is-delete { cursor:not-allowed; }
    #sketch-board .canvas-container {
      position:absolute !important; left:0 !important; top:0 !important;
      margin:0 !important; transform:none !important;
    }
    #sketch-board .canvas-container canvas {
      display:block; touch-action:none;
      position:absolute !important; left:0 !important; top:0 !important;
    }
    .qb-float {
      display:none; position:absolute; left:16px; top:16px; z-index:8; width:min(360px,calc(100vw - 120px));
      background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 18px 40px rgba(15,35,64,.18); padding:12px;
      pointer-events:none;
    }
    .qb-float.is-open { display:block; pointer-events:auto; }
    .qb-float header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .qb-float h2 { margin:0; font-size:.92rem; color:var(--navy); }
    .qb-float .close { border:0; background:transparent; font-size:1.2rem; cursor:pointer; color:var(--muted); }
    .qb-cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .qb-card {
      border:1px solid var(--line); background:var(--soft); border-radius:12px; padding:8px;
      cursor:pointer; text-align:center; color:var(--navy); font-weight:700; font-size:.75rem;
    }
    .qb-card:hover { border-color:#90caf9; background:#e3f2fd; }
    .qb-card svg { display:block; width:72px; height:44px; margin:0 auto 6px; }
    .qb-inspector {
      display:none; position:absolute; right:16px; top:16px; z-index:8; width:min(280px,calc(100vw - 110px));
      background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 18px 40px rgba(15,35,64,.16); padding:14px;
      pointer-events:none;
    }
    .qb-inspector.is-open { display:block; pointer-events:auto; }
    .qb-inspector h2 { margin:0 0 10px; font-size:.92rem; color:var(--navy); }
    .qb-inspector label { display:block; font-size:.72rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:8px 0 4px; }
    .qb-inspector input, .qb-inspector select {
      width:100%; min-height:38px; border:1px solid var(--line); border-radius:10px; padding:0 10px; font:inherit;
    }
    .qb-inspector .row { display:flex; gap:8px; }
    .qb-inspector .row > * { flex:1; }
    .qb-inspector .actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
    .qb-inspector button { border:1px solid var(--line); background:#fff; color:var(--navy); border-radius:10px; min-height:36px; padding:0 10px; font-weight:700; cursor:pointer; }
    .qb-inspector .danger { color:#b91c1c; border-color:#fecaca; }
    @media (max-width:720px) {
      .qb-rail { width:68px; flex-basis:68px; }
      .qb-float.is-open { width:min(320px,calc(100vw - 84px)); }
      .qb-inspector.is-open { width:min(260px,calc(100vw - 84px)); }
    }
  </style>
</head>
<body>
  <aside class="qb-rail" aria-label="Herramientas del plano">
    <a class="logo" href="{{ volver or '/estimado' }}">QB<br>Plano</a>
    <div class="grp">
      <button type="button" data-tool="select" class="is-on" title="Seleccionar">
        <svg viewBox="0 0 24 24"><path d="M4 4l7 16 2-7 7-2z"/></svg>
        Mover
      </button>
    </div>
    <div class="grp">
      <small>Arquitectura</small>
      <button type="button" data-tool="wall" title="Trazar muro">
        <svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h16M8 4v16M16 4v16"/></svg>
        Muro
      </button>
      <button type="button" data-tool="space" title="Trazar espacio">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></svg>
        Espacio
      </button>
      <button type="button" data-tool="opening" title="Apertura de pared">
        <svg viewBox="0 0 24 24"><path d="M4 12h6M14 12h6"/><path d="M10 8v8M14 8v8" stroke-dasharray="2 2"/></svg>
        Apertura
      </button>
    </div>
    <div class="grp">
      <small>Inserción</small>
      <button type="button" data-palette="accesos" title="Accesos">
        <svg viewBox="0 0 24 24"><path d="M5 20V6a2 2 0 0 1 2-2h7l5 5v11"/><path d="M14 4v5h5"/></svg>
        Accesos
      </button>
      <button type="button" data-palette="estructuras" title="Estructuras">
        <svg viewBox="0 0 24 24"><path d="M3 19h18M5 19V10l7-6 7 6v9"/></svg>
        Estructuras
      </button>
      <button type="button" data-tool="note" title="Nota">
        <svg viewBox="0 0 24 24"><path d="M4 20h16M7 16l10-10 3 3-10 10H7z"/></svg>
        Nota
      </button>
    </div>
    <div class="grp" style="margin-top:auto">
      <button type="button" data-tool="delete" title="Quitar elemento">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M8 7l1 12h6l1-12"/></svg>
        Quitar
      </button>
    </div>
  </aside>

  <div class="qb-shell">
    <header class="qb-top">
      <strong>Plano de obra</strong>
      <span class="meta">
        {% if folio %}{{ folio }}{% endif %}
        {% if cliente %} · {{ cliente }}{% endif %}
      </span>
      <span class="grow"></span>
      <span class="status" id="sketch-status">{% if inmutable %}Documento bloqueado.{% else %}Elige Muro, Espacio o Apertura y arrastra en el lienzo.{% endif %}</span>
      <button class="btn btn-primary" type="button" id="guardarPlano"{% if inmutable %} disabled{% endif %}>Guardar plano</button>
      <a class="btn" href="{{ volver or '/estimado' }}">Volver</a>
    </header>
    <div class="qb-stage">
      <div id="sketch-board" class="is-select">
        <canvas id="planoCanvas"></canvas>
      </div>
      <div class="qb-float" id="paletaFlotante" hidden>
        <header>
          <h2 id="paletaTitulo">Accesos</h2>
          <button type="button" class="close" id="paletaCerrar" aria-label="Cerrar">×</button>
        </header>
        <div class="qb-cards" id="paletaCards"></div>
      </div>
      <aside class="qb-inspector" id="inspector" hidden>
        <h2>Propiedades</h2>
        <label for="propTipo">Elemento</label>
        <input id="propTipo" readonly>
        <div class="row">
          <div>
            <label for="propLargo">Largo</label>
            <input id="propLargo" placeholder="8'-0&quot;">
          </div>
          <div>
            <label for="propAncho">Ancho</label>
            <input id="propAncho" placeholder="3'-0&quot;">
          </div>
        </div>
        <label for="propRot">Rotación</label>
        <input id="propRot" type="number" step="1" value="0">
        <div class="actions">
          <button type="button" id="propFlipH">Voltear H</button>
          <button type="button" id="propFlipV">Voltear V</button>
          <button type="button" class="danger" id="propBorrar">Quitar</button>
        </div>
      </aside>
    </div>
  </div>

  <script type="application/json" id="plano-inicial">{{ plano_json|tojson }}</script>
  <script>
    (function(){
      const DOC_ID={{ doc_id|tojson }};
      const INMUTABLE={{ inmutable|tojson }};
      const GRID=12;
      const SNAP=18;
      const PX_IN=1;
      const MIN_TRAZO=12;
      const JSON_PROPS=['selectable','evented','qbTipo','qbSnap','qbLabel'];
      const NAVY='#19385f';
      const BLUE='#0d47a1';
      const GOLD='#dba72b';
      const NOMBRES={
        wall:'Muro',
        opening:'Apertura de pared',
        space:'Espacio',
        'space-square':'Espacio rectangular',
        'space-l':'Espacio en L',
        'door-hinged':'Puerta abatible',
        'door-folding':'Puerta plegable',
        'door-sliding':'Puerta corrediza',
        'door-double':'Puerta doble',
        'window-operable':'Ventana practicable',
        'window-fixed':'Ventana fija',
        'window-sliding':'Ventana corredera',
        'roof-gable':'Cubierta a dos aguas',
        'stair-run':'Tramo de escalera',
        note:'Nota',
        cota:'Cota'
      };

      const board=document.getElementById('sketch-board');
      const status=document.getElementById('sketch-status');
      const saveBtn=document.getElementById('guardarPlano');
      const inspector=document.getElementById('inspector');
      const paleta=document.getElementById('paletaFlotante');
      const paletaCards=document.getElementById('paletaCards');
      const rail=document.querySelector('.qb-rail');
      const el=document.getElementById('planoCanvas');

      let canvas=null;
      let tool='select';
      let drawing=false;
      let origin=null;
      let hover=null;
      let pointerId=null;
      let guardando=false;

      function setStatus(msg, kind){
        if(!status) return;
        status.textContent=msg||'';
        status.className='status'+(kind?' '+kind:'');
      }
      function esDibujo(nombre){
        return nombre==='wall'||nombre==='opening'||nombre==='space'||nombre==='note'||nombre==='cota';
      }

      if(typeof fabric==='undefined' || !el){
        setStatus('No se pudo cargar el lienzo.','err');
        console.log('[QB Sketch] Fabric.js no está disponible');
        return;
      }

      canvas=new fabric.Canvas(el, {
        selection:true,
        preserveObjectStacking:true,
        stopContextMenu:true,
        allowTouchScrolling:false,
        enableRetinaScaling:false,
        fireRightClick:false,
        skipOffscreen:false
      });
      canvas.interactive=true;

      function tokenContratista(){
        try{ return localStorage.getItem('contratista_sesion')||sessionStorage.getItem('contratista_sesion')||''; }catch(_){ return ''; }
      }
      function headersAuth(){
        const headers={'Content-Type':'application/json','Accept':'application/json'};
        const token=tokenContratista();
        if(token) headers.Authorization='Bearer '+token;
        return headers;
      }

      function sizeCanvas(){
        if(!canvas || !board || drawing) return;
        const w=Math.max(320, Math.floor(board.clientWidth||0));
        const h=Math.max(320, Math.floor(board.clientHeight||0));
        if(canvas.getWidth()===w && canvas.getHeight()===h){
          canvas.calcOffset();
          return;
        }
        canvas.setDimensions({ width:w, height:h });
        const px=w+'px', py=h+'px';
        [canvas.wrapperEl, canvas.lowerCanvasEl, canvas.upperCanvasEl].forEach(function(nodo){
          if(!nodo) return;
          nodo.style.width=px;
          nodo.style.height=py;
          nodo.style.maxWidth='none';
          nodo.style.maxHeight='none';
          nodo.style.left='0px';
          nodo.style.top='0px';
        });
        canvas.calcOffset();
        canvas.requestRenderAll();
      }

      function fmtPies(px){
        const total=Math.max(0, Math.round(Math.abs(px)/PX_IN));
        return Math.floor(total/12)+"'-"+(total%12)+'"';
      }
      function parsePies(texto){
        const t=String(texto||'').trim();
        const m=t.match(/(-?\d+)\s*'\s*-?\s*(\d+)?/);
        if(m) return (parseInt(m[1],10)*12 + parseInt(m[2]||'0',10))*PX_IN;
        const n=parseFloat(t);
        return isFinite(n)? n*12*PX_IN : null;
      }

      function dibujarPuntos(ctx){
        const w=canvas.getWidth(), h=canvas.getHeight();
        ctx.save();
        ctx.fillStyle='#eef2f6';
        ctx.fillRect(0,0,w,h);
        ctx.fillStyle='rgba(25,56,95,0.22)';
        for(let x=0;x<=w;x+=GRID){
          for(let y=0;y<=h;y+=GRID) ctx.fillRect(x,y,1.2,1.2);
        }
        ctx.fillStyle='rgba(25,56,95,0.4)';
        for(let x=0;x<=w;x+=GRID*5){
          for(let y=0;y<=h;y+=GRID*5) ctx.fillRect(x,y,2,2);
        }
        ctx.restore();
      }
      canvas.on('before:render', function(){
        if(canvas.contextContainer) dibujarPuntos(canvas.contextContainer);
      });
      canvas.on('after:render', function(){
        if(drawing && origin && hover) pintarPreview(origin, hover);
      });

      function puntoDesdeEvento(ev){
        const capa=canvas.upperCanvasEl||canvas.lowerCanvasEl||el;
        const caja=capa.getBoundingClientRect();
        const sx=(capa.width||caja.width)/(caja.width||1);
        const sy=(capa.height||caja.height)/(caja.height||1);
        return {
          x:(ev.clientX-caja.left)*sx,
          y:(ev.clientY-caja.top)*sy
        };
      }

      function estiloSimbolo(obj, tipo, snap){
        obj.set({
          qbTipo:tipo, qbSnap:snap||'', qbLabel:NOMBRES[tipo]||tipo,
          selectable:true, evented:true, hasControls:true, hasBorders:true,
          lockScalingFlip:false, transparentCorners:false, objectCaching:false,
          cornerColor:BLUE, cornerStyle:'circle', borderColor:'#90caf9',
          padding:4, originX:'center', originY:'center'
        });
        return obj;
      }
      function grupo(shapes, tipo, snap){
        return estiloSimbolo(new fabric.Group(shapes,{ subTargetCheck:false, objectCaching:false }), tipo, snap);
      }
      function linea(x1,y1,x2,y2, extra){
        return new fabric.Line([x1,y1,x2,y2], Object.assign({
          stroke:NAVY, strokeWidth:3, strokeLineCap:'round', selectable:false, evented:false, objectCaching:false
        }, extra||{}));
      }
      function simboloPuertaAbatible(){
        const W=56;
        return grupo([
          linea(-4,0,W+4,0,{strokeWidth:5}),
          linea(0,0,0,W,{strokeWidth:3, stroke:BLUE}),
          new fabric.Path('M '+W+' 0 A '+W+' '+W+' 0 0 0 0 '+W,{ fill:'rgba(13,71,161,0.08)', stroke:BLUE, strokeWidth:1.5, selectable:false, evented:false }),
          new fabric.Circle({ left:0, top:0, radius:3, fill:BLUE, originX:'center', originY:'center', selectable:false, evented:false })
        ], 'door-hinged', 'wall');
      }
      function simboloPuertaPlegable(){
        return grupo([
          linea(0,0,80,0,{strokeWidth:5}),
          linea(8,0,20,-18,{stroke:BLUE}), linea(20,-18,32,0,{stroke:BLUE}),
          linea(32,0,44,-18,{stroke:BLUE}), linea(44,-18,56,0,{stroke:BLUE}),
          linea(56,0,68,-18,{stroke:BLUE}), linea(68,-18,76,0,{stroke:BLUE})
        ], 'door-folding', 'wall');
      }
      function simboloPuertaCorrediza(){
        return grupo([
          linea(0,0,84,0,{strokeWidth:5}),
          new fabric.Rect({ left:4, top:-11, width:44, height:8, fill:'#edf5fb', stroke:BLUE, strokeWidth:1.5, rx:1, selectable:false, evented:false }),
          new fabric.Rect({ left:36, top:3, width:44, height:8, fill:'#fff', stroke:BLUE, strokeWidth:1.5, rx:1, selectable:false, evented:false })
        ], 'door-sliding', 'wall');
      }
      function simboloPuertaDoble(){
        const W=104, R=48;
        return grupo([
          linea(-4,0,W+4,0,{strokeWidth:5}),
          linea(0,0,0,R,{strokeWidth:3, stroke:BLUE}),
          linea(W,0,W,R,{strokeWidth:3, stroke:BLUE}),
          new fabric.Path('M '+R+' 0 A '+R+' '+R+' 0 0 0 0 '+R,{ fill:'rgba(13,71,161,0.07)', stroke:BLUE, strokeWidth:1.5, selectable:false, evented:false }),
          new fabric.Path('M '+(W-R)+' 0 A '+R+' '+R+' 0 0 1 '+W+' '+R,{ fill:'rgba(13,71,161,0.07)', stroke:BLUE, strokeWidth:1.5, selectable:false, evented:false })
        ], 'door-double', 'wall');
      }
      function marcoVano(extra){
        return [
          linea(0,-7,72,-7,{strokeWidth:4}),
          linea(0,0,72,0,{strokeWidth:1.6, stroke:BLUE}),
          linea(0,7,72,7,{strokeWidth:4}),
          linea(0,-7,0,7,{strokeWidth:3}),
          linea(72,-7,72,7,{strokeWidth:3})
        ].concat(extra||[]);
      }
      function simboloVentanaPracticable(){ return grupo(marcoVano(), 'window-operable', 'wall'); }
      function simboloVentanaFija(){
        return grupo(marcoVano([
          linea(8,-7,64,7,{strokeWidth:1.3, stroke:'#627083'}),
          linea(64,-7,8,7,{strokeWidth:1.3, stroke:'#627083'})
        ]), 'window-fixed', 'wall');
      }
      function simboloVentanaCorredera(){
        return grupo(marcoVano([
          new fabric.Rect({ left:4, top:-5, width:32, height:10, fill:'rgba(13,71,161,0.08)', stroke:BLUE, strokeWidth:1.2, selectable:false, evented:false }),
          new fabric.Rect({ left:36, top:-5, width:32, height:10, fill:'#fff', stroke:BLUE, strokeWidth:1.2, selectable:false, evented:false })
        ]), 'window-sliding', 'wall');
      }
      function simboloEspacioRect(){
        return estiloSimbolo(new fabric.Rect({
          width:168, height:144, fill:'rgba(13,71,161,0.05)', stroke:NAVY, strokeWidth:5, objectCaching:false
        }), 'space-square', '');
      }
      function simboloEspacioL(){
        return estiloSimbolo(new fabric.Polygon([
          {x:0,y:0},{x:180,y:0},{x:180,y:90},{x:90,y:90},{x:90,y:180},{x:0,y:180}
        ], { fill:'rgba(13,71,161,0.05)', stroke:NAVY, strokeWidth:5, objectCaching:false }), 'space-l', '');
      }
      function simboloCubierta(){
        return grupo([
          linea(0,48,60,0,{strokeWidth:3}),
          linea(60,0,120,48,{strokeWidth:3}),
          linea(0,48,120,48,{strokeWidth:2, stroke:GOLD}),
          linea(60,0,60,48,{strokeWidth:1.4, strokeDashArray:[4,3], stroke:BLUE})
        ], 'roof-gable', '');
      }
      function simboloEscalera(){
        const treads=[];
        for(let i=0;i<7;i++) treads.push(linea(0, i*10, 56, i*10,{strokeWidth:2}));
        treads.push(linea(28,0,28,70,{strokeWidth:2, stroke:BLUE}));
        treads.push(linea(20,58,28,70,{stroke:BLUE}));
        treads.push(linea(36,58,28,70,{stroke:BLUE}));
        return grupo(treads, 'stair-run', '');
      }

      const FABRICAS={
        'door-hinged':simboloPuertaAbatible,
        'door-folding':simboloPuertaPlegable,
        'door-sliding':simboloPuertaCorrediza,
        'door-double':simboloPuertaDoble,
        'window-operable':simboloVentanaPracticable,
        'window-fixed':simboloVentanaFija,
        'window-sliding':simboloVentanaCorredera,
        'space-square':simboloEspacioRect,
        'space-l':simboloEspacioL,
        'roof-gable':simboloCubierta,
        'stair-run':simboloEscalera
      };
      const PALETAS={
        accesos:{
          titulo:'Accesos',
          items:[

      function abrirPaleta(clave){
        const def=PALETAS[clave];
        if(!def) return;
        document.getElementById('paletaTitulo').textContent=def.titulo;
        paletaCards.innerHTML=def.items.map(function(it){
          return '<button type="button" class="qb-card" data-insert="'+it.id+'"><svg viewBox="0 0 32 28">'+it.svg+'</svg>'+it.label+'</button>';
        }).join('');
        paleta.hidden=false;
        paleta.classList.add('is-open');
      }
      function cerrarPaleta(){
        paleta.classList.remove('is-open');
        paleta.hidden=true;
      }

      function insertarSimbolo(tipo){
        if(INMUTABLE){ setStatus('Este documento no se puede editar.','err'); return; }
        const factory=FABRICAS[tipo];
        if(!factory) return;
        const obj=factory();
        obj.set({ left:canvas.getWidth()/2, top:canvas.getHeight()/2 });
        canvas.add(obj);
        aplicarTool('select');
        canvas.setActiveObject(obj);
        canvas.requestRenderAll();
        refrescarInspector();
        cerrarPaleta();
        setStatus(obj.qbSnap==='wall'?'Colócalo sobre un muro para que se alinee.':'Ajusta tamaño y rotación en el panel.');
      }

      function limpiarPreview(){
        if(canvas.contextTop) canvas.clearContext(canvas.contextTop);
      }
      function pintarPreview(a, b){
        const ctx=canvas.contextTop;
        if(!ctx || !a || !b) return;
        canvas.clearContext(ctx);
        ctx.save();
        ctx.lineCap='round';
        ctx.lineJoin='round';
        if(tool==='space'){
          const x=Math.min(a.x,b.x), y=Math.min(a.y,b.y);
          const w=Math.max(1, Math.abs(b.x-a.x)), h=Math.max(1, Math.abs(b.y-a.y));
          ctx.fillStyle='rgba(13,71,161,0.08)';
          ctx.strokeStyle=NAVY;
          ctx.lineWidth=4;
          ctx.fillRect(x,y,w,h);
          ctx.strokeRect(x,y,w,h);
        }else{
          ctx.strokeStyle=tool==='opening'?GOLD:NAVY;
          ctx.lineWidth=tool==='opening'?3:6;
          if(tool==='opening') ctx.setLineDash([10,6]);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.fillStyle=BLUE;
        ctx.font='700 13px system-ui,Segoe UI,sans-serif';
        ctx.textAlign='center';
        ctx.textBaseline='bottom';
        ctx.fillText(fmtPies(Math.hypot(b.x-a.x, b.y-a.y)), (a.x+b.x)/2, (a.y+b.y)/2 - 10);
        ctx.restore();
      }

      function masCercano(p,a,b){
        const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy;
        if(len2<1) return {x:a.x,y:a.y,dist:Math.hypot(p.x-a.x,p.y-a.y),angle:0};
        let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/len2;
        t=Math.max(0, Math.min(1,t));
        const x=a.x+t*dx, y=a.y+t*dy;
        return {x:x,y:y,dist:Math.hypot(p.x-x,p.y-y),angle:Math.atan2(dy,dx)};
      }
      function puntoCanvas(obj, pt){
        return fabric.util.transformPoint(new fabric.Point(pt.x, pt.y), obj.calcTransformMatrix());
      }
      function extremosAbsolutos(obj){
        if(!obj) return [];
        if(obj.type==='line'){
          try{
            const pts=obj.calcLinePoints();
            return [{ a:puntoCanvas(obj,{x:pts.x1,y:pts.y1}), b:puntoCanvas(obj,{x:pts.x2,y:pts.y2}) }];
          }catch(_){ return []; }
        }
        if(obj.type==='polygon' || obj.qbTipo==='space-l'){
          const pts=obj.points||[];
          const off=obj.pathOffset||{x:0,y:0};
          const segs=[];
          for(let i=0;i<pts.length;i++){
            const cur=pts[i], nxt=pts[(i+1)%pts.length];
            segs.push({
              a:puntoCanvas(obj,{x:cur.x-off.x,y:cur.y-off.y}),
              b:puntoCanvas(obj,{x:nxt.x-off.x,y:nxt.y-off.y})
            });
          }
          return segs;
        }
        const c=obj.aCoords||obj.calcACoords();
        if(!c||!c.tl) return [];
        return [{a:c.tl,b:c.tr},{a:c.tr,b:c.br},{a:c.br,b:c.bl},{a:c.bl,b:c.tl}];
      }
      function esPared(obj){
        if(!obj || obj.qbSnap==='wall' || obj.qbTipo==='cota' || obj.qbTipo==='note') return false;
        const t=obj.qbTipo||'';
        return t==='wall'||t==='opening'||t==='space'||t==='space-square'||t==='space-l'||obj.type==='line';
      }
      function paredesDelPlano(){
        const segs=[];
        try{
          canvas.getObjects().forEach(function(obj){
            if(!esPared(obj)) return;
            extremosAbsolutos(obj).forEach(function(seg){ if(seg && seg.a && seg.b) segs.push(seg); });
          });
        }catch(err){
          console.log('[QB Sketch] paredes', err);
        }
        return segs;
      }
      function snapPunto(p, ancla){
        let x=Math.round(p.x/GRID)*GRID;
        let y=Math.round(p.y/GRID)*GRID;
        if(ancla){
          const dx=Math.abs(x-ancla.x), dy=Math.abs(y-ancla.y);
          if(dx>=dy) y=ancla.y;
          else x=ancla.x;
        }
        try{
          let mejor=null;
          paredesDelPlano().forEach(function(seg){
            const hit=masCercano({x:x,y:y}, seg.a, seg.b);
            if(!mejor || hit.dist<mejor.dist) mejor=hit;
            [{p:seg.a},{p:seg.b}].forEach(function(nodo){
              const d=Math.hypot(x-nodo.p.x, y-nodo.p.y);
              if(!mejor || d<mejor.dist) mejor={x:nodo.p.x,y:nodo.p.y,dist:d,angle:mejor?mejor.angle:0};
            });
          });
          if(mejor && mejor.dist<=SNAP){ x=mejor.x; y=mejor.y; }
        }catch(_){ }
        return {x:x,y:y};
      }
      function adherirAPared(obj){
        if(!obj || obj.qbSnap!=='wall') return false;
        const centro=obj.getCenterPoint();
        let mejor=null;
        paredesDelPlano().forEach(function(seg){
          const hit=masCercano(centro, seg.a, seg.b);
          if(!mejor||hit.dist<mejor.dist) mejor=hit;
        });
        if(!mejor||mejor.dist>SNAP) return false;
        obj.setPositionByOrigin(new fabric.Point(mejor.x, mejor.y), 'center', 'center');
        obj.rotate(mejor.angle*180/Math.PI);
        obj.setCoords();
        return true;
      }

      function estiloTrazo(obj, tipo){
        obj.set({
          qbTipo:tipo,
          qbSnap:'',
          qbLabel:NOMBRES[tipo]||tipo,
          selectable:true,
          evented:true,
          objectCaching:false,
          hasControls:true,
          hasBorders:true,
          cornerColor:BLUE,
          cornerStyle:'circle',
          borderColor:'#90caf9'
        });
        return obj;
      }
      function crearLineaAbsoluta(a, b, tipo){
        const lineaNueva=new fabric.Line([a.x, a.y, b.x, b.y], {
          stroke: tipo==='opening'?GOLD:NAVY,
          strokeWidth: tipo==='opening'?3:6,
          strokeDashArray: tipo==='opening'?[10,6]:null,
          strokeLineCap:'round',
          originX:'center',
          originY:'center',
          objectCaching:false
        });
        estiloTrazo(lineaNueva, tipo);
        lineaNueva.qbLabel=fmtPies(Math.hypot(b.x-a.x, b.y-a.y));
        return lineaNueva;
      }
      function crearEspacio(a, b){
        const rect=new fabric.Rect({
          left:Math.min(a.x,b.x),
          top:Math.min(a.y,b.y),
          width:Math.max(1, Math.abs(b.x-a.x)),
          height:Math.max(1, Math.abs(b.y-a.y)),
          fill:'rgba(13,71,161,0.06)',
          stroke:NAVY,
          strokeWidth:4,
          originX:'left',
          originY:'top',
          objectCaching:false
        });
        estiloTrazo(rect, 'space');
        rect.qbLabel=fmtPies(rect.width)+' × '+fmtPies(rect.height);
        return rect;
      }
      function crearCota(a, b){
        return new fabric.Text(fmtPies(Math.hypot(b.x-a.x, b.y-a.y)), {
          left:(a.x+b.x)/2,
          top:(a.y+b.y)/2-16,
          fontSize:13,
          fill:BLUE,
          fontWeight:'700',
          originX:'center',
          originY:'center',
          selectable:true,
          evented:true,
          objectCaching:false,
          qbTipo:'cota',
          qbLabel:'Cota'
        });
      }

      function cancelarTrazo(){
        drawing=false;
        origin=null;
        hover=null;
        pointerId=null;
        limpiarPreview();
      }
      function commitTrazo(destino){
        if(!origin || !destino){ cancelarTrazo(); return; }
        const dx=destino.x-origin.x, dy=destino.y-origin.y;
        if(tool==='space'){
          if(Math.abs(dx)<MIN_TRAZO || Math.abs(dy)<MIN_TRAZO){
            setStatus('Arrastra un recuadro más grande para el espacio.');
            cancelarTrazo();
            return;
          }
          const espacio=crearEspacio(origin, destino);
          canvas.add(espacio);
          canvas.setActiveObject(espacio);
        }else if(tool==='wall' || tool==='opening'){
          if(Math.hypot(dx,dy)<MIN_TRAZO){
            setStatus('Arrastra al menos 1 pie para confirmar el trazo.');
            cancelarTrazo();
            return;
          }
          const muro=crearLineaAbsoluta(origin, destino, tool);
          canvas.add(muro);
          canvas.add(crearCota(origin, destino));
          canvas.setActiveObject(muro);
        }
        cancelarTrazo();
        canvas.requestRenderAll();
        refrescarInspector();
        setStatus('Elemento añadido. Sigue trazando o pulsa Mover.','ok');
      }

      function aplicarTool(nombre){
        tool=nombre||'select';
        cancelarTrazo();
        canvas.isDrawingMode=false;
        canvas.interactive=true;
        canvas.discardActiveObject();
        canvas.selection=!esDibujo(tool) && tool!=='delete';
        canvas.skipTargetFind=esDibujo(tool);
        canvas.forEachObject(function(obj){
          const editable=tool==='select';
          obj.selectable=editable;
          obj.evented=editable || tool==='delete';
        });
        canvas.defaultCursor=tool==='select'?'default':(tool==='delete'?'not-allowed':(tool==='note'||tool==='cota'?'text':'crosshair'));
        canvas.hoverCursor=tool==='select'?'move':canvas.defaultCursor;
        if(board){
          board.className=esDibujo(tool) && tool!=='note' && tool!=='cota' ? 'is-draw'
            : (tool==='delete'?'is-delete':(tool==='note'||tool==='cota'?'is-note':'is-select'));
        }
        document.querySelectorAll('.qb-rail [data-tool]').forEach(function(btn){
          btn.classList.toggle('is-on', btn.dataset.tool===tool);
        });
        document.querySelectorAll('.qb-rail [data-palette]').forEach(function(btn){ btn.classList.remove('is-on'); });
        canvas.calcOffset();
        canvas.requestRenderAll();
        refrescarInspector();
        const ayudas={
          wall:'Muro listo: pulsa y arrastra. La cota aparece en pies y pulgadas.',
          space:'Espacio listo: arrastra el rectángulo del área.',
          opening:'Apertura lista: traza el vano sobre el muro.',
          note:'Nota lista: toca el lienzo para escribir.',
          delete:'Toca un elemento para quitarlo.',
          select:'Selecciona un elemento o una herramienta de trazo.'
        };
        setStatus(ayudas[tool]||ayudas.select);
        console.log('[QB Sketch] herramienta', tool);
      }
      window.qbSketchHerramienta=function(nombre){
        try{ cerrarPaleta(); aplicarTool(nombre); }
        catch(err){ console.log('[QB Sketch] error herramienta', err); setStatus(String(err.message||err),'err'); }
      };

      function enPaletaOInspector(nodo){
        return !!(nodo && (nodo.closest && (nodo.closest('.qb-float') || nodo.closest('.qb-inspector') || nodo.closest('.qb-rail') || nodo.closest('.qb-top') || nodo.closest('#qb-soporte'))));
      }

      function alPunteroAbajo(ev){
        if(INMUTABLE || !esDibujo(tool)) return;
        if(enPaletaOInspector(ev.target)) return;
        if(ev.pointerType==='mouse' && ev.button!==0) return;
        ev.preventDefault();
        ev.stopPropagation();
        const crudo=puntoDesdeEvento(ev);
        const p=snapPunto(crudo);
        if(tool==='note' || tool==='cota'){
          const texto=new fabric.IText(tool==='cota'? "8'-0\"" : 'Nota',{
            left:p.x, top:p.y, fontSize:14, fill:BLUE, fontFamily:'Arial', fontWeight:'700',
            objectCaching:false, qbTipo:tool==='cota'?'cota':'note'
          });
          canvas.add(texto);
          aplicarTool('select');
          canvas.setActiveObject(texto);
          texto.enterEditing();
          canvas.requestRenderAll();
          return;
        }
        drawing=true;
        origin=p;
        hover=p;
        pointerId=ev.pointerId;
        try{ board.setPointerCapture(ev.pointerId); }catch(_){ }
        pintarPreview(origin, hover);
        setStatus('Trazando… 0\'-0"');
        console.log('[QB Sketch] pointerdown', tool, p);
      }
      function alPunteroMueve(ev){
        if(!drawing || !origin) return;
        ev.preventDefault();
        hover=snapPunto(puntoDesdeEvento(ev), (tool==='wall'||tool==='opening')?origin:null);
        pintarPreview(origin, hover);
        setStatus('Trazando… '+fmtPies(Math.hypot(hover.x-origin.x, hover.y-origin.y)));
      }
      function alPunteroArriba(ev){
        if(!drawing) return;
        ev.preventDefault();
        const destino=snapPunto(puntoDesdeEvento(ev), (tool==='wall'||tool==='opening')?origin:null);
        try{ if(pointerId!=null) board.releasePointerCapture(pointerId); }catch(_){ }
        console.log('[QB Sketch] pointerup', tool, origin, destino);
        commitTrazo(destino);
      }

      board.addEventListener('pointerdown', alPunteroAbajo, true);
      board.addEventListener('pointermove', alPunteroMueve, true);
      board.addEventListener('pointerup', alPunteroArriba, true);
      board.addEventListener('pointercancel', function(){ cancelarTrazo(); }, true);
      board.addEventListener('contextmenu', function(ev){ if(esDibujo(tool)) ev.preventDefault(); });

      canvas.on('object:moving', function(e){ if(e.target) adherirAPared(e.target); });
      canvas.on('object:modified', function(e){ if(e.target){ adherirAPared(e.target); refrescarInspector(); } });
      canvas.on('selection:created', refrescarInspector);
      canvas.on('selection:updated', refrescarInspector);
      canvas.on('selection:cleared', refrescarInspector);
      canvas.on('mouse:down', function(opt){
        if(INMUTABLE || tool!=='delete' || !opt.target) return;
        canvas.remove(opt.target);
        refrescarInspector();
        canvas.requestRenderAll();
      });

      function objetoActivo(){ return canvas.getActiveObject(); }
      function refrescarInspector(){
        const obj=objetoActivo();
        if(!obj || tool!=='select'){
          inspector.classList.remove('is-open');
          inspector.hidden=true;
          return;
        }
        inspector.hidden=false;
        inspector.classList.add('is-open');
        document.getElementById('propTipo').value=NOMBRES[obj.qbTipo]||obj.qbLabel||obj.type;
        const w=obj.getScaledWidth?obj.getScaledWidth():(obj.width||0);
        const h=obj.getScaledHeight?obj.getScaledHeight():(obj.height||0);
        if(obj.type==='line'){
          try{
            const segs=extremosAbsolutos(obj)[0];
            document.getElementById('propLargo').value=segs?fmtPies(Math.hypot(segs.b.x-segs.a.x, segs.b.y-segs.a.y)):'';
          }catch(_){
            document.getElementById('propLargo').value='';
          }
          document.getElementById('propAncho').value='';
        }else{
          document.getElementById('propLargo').value=fmtPies(w);
          document.getElementById('propAncho').value=fmtPies(h);
        }
        document.getElementById('propRot').value=Math.round(obj.angle||0);
      }
      function aplicarMedida(){
        const obj=objetoActivo();
        if(!obj) return;
        const largo=parsePies(document.getElementById('propLargo').value);
        const ancho=parsePies(document.getElementById('propAncho').value);
        const rot=parseFloat(document.getElementById('propRot').value);
        if(obj.type==='line' && largo){
          const segs=extremosAbsolutos(obj)[0];
          if(segs){
            const ang=Math.atan2(segs.b.y-segs.a.y, segs.b.x-segs.a.x);
            const recambio=crearLineaAbsoluta(segs.a, {
              x:segs.a.x+Math.cos(ang)*largo,
              y:segs.a.y+Math.sin(ang)*largo
            }, obj.qbTipo||'wall');
            canvas.remove(obj);
            canvas.add(recambio);
            canvas.setActiveObject(recambio);
          }
        }else{
          if(largo && obj.width) obj.scaleX=largo/Math.max(obj.width,1);
          if(ancho && obj.height) obj.scaleY=ancho/Math.max(obj.height,1);
        }
        if(isFinite(rot)) obj.rotate(rot);
        obj.setCoords();
        canvas.requestRenderAll();
        refrescarInspector();
      }
      document.getElementById('propLargo').addEventListener('change', aplicarMedida);
      document.getElementById('propAncho').addEventListener('change', aplicarMedida);
      document.getElementById('propRot').addEventListener('change', aplicarMedida);
      document.getElementById('propFlipH').addEventListener('click', function(){
        const obj=objetoActivo(); if(!obj) return; obj.set('flipX', !obj.flipX); canvas.requestRenderAll();
      });
      document.getElementById('propFlipV').addEventListener('click', function(){
        const obj=objetoActivo(); if(!obj) return; obj.set('flipY', !obj.flipY); canvas.requestRenderAll();
      });
      document.getElementById('propBorrar').addEventListener('click', function(){
        const obj=objetoActivo(); if(!obj) return; canvas.remove(obj); refrescarInspector();
      });

      if(rail){
        rail.addEventListener('click', function(ev){
          const btn=ev.target.closest('[data-tool],[data-palette]');
          if(!btn || !rail.contains(btn)) return;
          ev.preventDefault();
          if(btn.dataset.palette){
            aplicarTool('select');
            rail.querySelectorAll('[data-palette]').forEach(function(b){ b.classList.toggle('is-on', b===btn); });
            abrirPaleta(btn.dataset.palette);
            return;
          }
          if(btn.dataset.tool) window.qbSketchHerramienta(btn.dataset.tool);
        });
      }
      document.getElementById('paletaCerrar').addEventListener('click', cerrarPaleta);
      paletaCards.addEventListener('click', function(ev){
        const card=ev.target.closest('[data-insert]');
        if(card) insertarSimbolo(card.dataset.insert);
      });
      document.addEventListener('keydown', function(ev){
        if(ev.key==='Escape'){
          if(drawing) cancelarTrazo();
          cerrarPaleta();
          if(esDibujo(tool)) aplicarTool('select');
        }
        if(INMUTABLE) return;
        if(ev.key!=='Delete' && ev.key!=='Backspace') return;
        const t=ev.target;
        if(t && (t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
        const activo=objetoActivo();
        if(activo && !activo.isEditing){ ev.preventDefault(); canvas.remove(activo); refrescarInspector(); }
      });

      function exportar(){
        if(!canvas) throw new Error('El lienzo no está listo.');
        canvas.discardActiveObject();
        limpiarPreview();
        canvas.requestRenderAll();
        const json=canvas.toJSON(JSON_PROPS);
        let imagen='';
        try{ imagen=canvas.toDataURL({ format:'png', multiplier:1, enableRetinaScaling:false }); }
        catch(_){ imagen=canvas.toDataURL('png'); }
        if(imagen && imagen.length>1200000){
          imagen=canvas.toDataURL({ format:'jpeg', quality:0.82, multiplier:1 });
        }
        canvas.requestRenderAll();
        return { json:json, imagen:imagen };
      }
      async function guardar(){
        if(guardando) return;
        console.log('[QB Sketch] guardar', { id:DOC_ID, objetos:canvas.getObjects().length });
        if(INMUTABLE){ setStatus('Este documento no se puede editar.','err'); return; }
        if(!DOC_ID){ setStatus('Falta el documento para guardar el plano.','err'); return; }
        guardando=true;
        try{
          if(saveBtn) saveBtn.disabled=true;
          setStatus('Guardando plano...');
          const payload=exportar();
          const res=await fetch('/api/proyecto/'+encodeURIComponent(DOC_ID)+'/sketch',{
            method:'POST', credentials:'same-origin', headers:headersAuth(), body:JSON.stringify(payload)
          });
          const json=await res.json().catch(function(){ return {}; });
          if(!res.ok) throw new Error(json.error||'No se pudo guardar el plano.');
          setStatus('Plano guardado. Aparecerá en el PDF.','ok');
        }catch(err){
          console.log('[QB Sketch] error guardar', err);
          setStatus(err.message||'No se pudo guardar el plano.','err');
        }finally{
          guardando=false;
          if(saveBtn && !INMUTABLE) saveBtn.disabled=false;
        }
      }
      window.qbSketchGuardar=guardar;
      if(saveBtn) saveBtn.addEventListener('click', function(ev){ ev.preventDefault(); guardar(); });

      function cargarInicial(){
        let bruto=null;
        try{ bruto=JSON.parse(document.getElementById('plano-inicial').textContent||'null'); }catch(_){ bruto=null; }
        if(!bruto) return;
        canvas.loadFromJSON(bruto, function(){
          canvas.getObjects().forEach(function(obj){ obj.objectCaching=false; obj.setCoords(); });
          aplicarTool('select');
          canvas.requestRenderAll();
        });
      }
      function arrancarLienzo(){
        sizeCanvas();
        cargarInicial();
        aplicarTool('select');
        canvas.calcOffset();
        console.log('[QB Sketch] listo', canvas.getWidth(), canvas.getHeight());
      }
      requestAnimationFrame(function(){ requestAnimationFrame(arrancarLienzo); });
      window.addEventListener('resize', sizeCanvas);
      if(window.ResizeObserver && board){
        new ResizeObserver(function(){ sizeCanvas(); }).observe(board);
      }
    })();
  </script>
  {% include "base.html" %}
</body>
</html>
