<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Plano{% if folio %} {{ folio }}{% endif %} | QuantixBuilds</title>
  <style>
    :root {
      --navy:#19385f; --navy-deep:#0b1f3a; --blue:#0d47a1; --blue-mid:#2d70ad;
      --gold:#dba72b; --ink:#1d2b3b; --muted:#627083; --line:#d7e0e8;
      --paper:#fff; --canvas:#eef2f6; --soft:#edf5fb;
    }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; background:var(--canvas); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    body { display:flex; min-height:100%; }
    .qb-rail {
      width:84px; flex:0 0 84px; background:var(--navy-deep); color:#dbe7f3;
      display:flex; flex-direction:column; align-items:center; padding:12px 8px 16px; z-index:6;
    }
    .qb-rail a.logo { color:#fff; font-weight:800; font-size:.72rem; letter-spacing:.04em; text-decoration:none; text-align:center; margin-bottom:14px; line-height:1.2; }
    .qb-rail .grp { width:100%; display:flex; flex-direction:column; gap:4px; margin:8px 0; }
    .qb-rail .grp small { display:block; text-align:center; font-size:.58rem; letter-spacing:.08em; text-transform:uppercase; color:#8aa0b8; margin:2px 0 4px; }
    .qb-rail button {
      width:100%; border:0; background:transparent; color:#dbe7f3; border-radius:12px;
      padding:8px 4px 7px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
      font-size:.62rem; font-weight:700; line-height:1.15;
    }
    .qb-rail button svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .qb-rail button:hover { background:rgba(255,255,255,.08); }
    .qb-rail button.is-on { background:var(--blue); color:#fff; }
    .qb-shell { flex:1; min-width:0; display:flex; flex-direction:column; }
    .qb-top {
      height:56px; background:var(--paper); border-bottom:1px solid var(--line);
      display:flex; align-items:center; gap:14px; padding:0 16px; z-index:5;
    }
    .qb-top strong { color:var(--navy); }
    .qb-top .meta { color:var(--muted); font-size:.88rem; }
    .qb-top .grow { flex:1; }
    .qb-top .status { font-size:.82rem; color:var(--muted); }
    .qb-top .status.ok { color:#27834e; }
    .qb-top .status.err { color:#b91c1c; }
    .qb-top .btn {
      min-height:36px; border:1px solid var(--line); background:#fff; color:var(--navy);
      border-radius:10px; padding:0 12px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center;
    }
    .qb-top .btn-primary { background:var(--blue); border-color:var(--blue); color:#fff; }
    .qb-top .btn-primary:disabled { opacity:.6; cursor:wait; }
    .qb-stage { flex:1; position:relative; min-height:0; isolation:isolate; }
    #sketch-board {
      position:absolute; inset:0; z-index:1; background:var(--canvas);
      pointer-events:auto; touch-action:none; user-select:none; overflow:hidden;
    }
    #sketch-board.is-draw { cursor:crosshair; }
    #sketch-board.is-note { cursor:text; }
    #sketch-board.is-delete { cursor:not-allowed; }
    #planoSvg { display:block; width:100%; height:100%; touch-action:none; }
    .qb-room-fill { fill:rgba(13,71,161,.06); cursor:pointer; }
    .qb-room-fill.is-on { fill:rgba(13,71,161,.12); }
    .qb-wall { fill:none; stroke:#19385f; stroke-width:6; stroke-linecap:butt; stroke-linejoin:miter; }
    .qb-preview { fill:none; stroke:#0d47a1; stroke-width:2; stroke-dasharray:6 4; pointer-events:none; }
    .qb-cota { font:700 12px system-ui,Segoe UI,sans-serif; fill:#0d47a1; pointer-events:none; }
    .qb-handle { fill:#fff; stroke:#0d47a1; stroke-width:2; cursor:move; }
    .qb-note { font:700 13px Arial,sans-serif; fill:#0d47a1; cursor:pointer; }
    .qb-float {
      display:none; position:absolute; left:16px; top:16px; z-index:8; width:min(360px,calc(100vw - 120px));
      background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 18px 40px rgba(15,35,64,.18); padding:12px;
      pointer-events:none;
    }
    .qb-float.is-open { display:block; pointer-events:auto; }
    .qb-float header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .qb-float h2 { margin:0; font-size:.92rem; color:var(--navy); }
    .qb-float .close { border:0; background:transparent; font-size:1.2rem; cursor:pointer; color:var(--muted); }
    .qb-cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .qb-card {
      border:1px solid var(--line); background:var(--soft); border-radius:12px; padding:8px;
      cursor:pointer; text-align:center; color:var(--navy); font-weight:700; font-size:.75rem;
    }
    .qb-card:hover { border-color:#90caf9; background:#e3f2fd; }
    .qb-card svg { display:block; width:72px; height:44px; margin:0 auto 6px; }
    .qb-inspector {
      display:none; position:absolute; right:16px; top:16px; z-index:8; width:min(280px,calc(100vw - 110px));
      background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 18px 40px rgba(15,35,64,.16); padding:14px;
      pointer-events:none;
    }
    .qb-inspector.is-open { display:block; pointer-events:auto; }
    .qb-inspector h2 { margin:0 0 10px; font-size:.92rem; color:var(--navy); }
    .qb-inspector label { display:block; font-size:.72rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:8px 0 4px; }
    .qb-inspector input { width:100%; min-height:38px; border:1px solid var(--line); border-radius:10px; padding:0 10px; font:inherit; }
    .qb-inspector .row { display:flex; gap:8px; }
    .qb-inspector .row > * { flex:1; }
    .qb-inspector .actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
    .qb-inspector button { border:1px solid var(--line); background:#fff; color:var(--navy); border-radius:10px; min-height:36px; padding:0 10px; font-weight:700; cursor:pointer; }
    .qb-inspector .danger { color:#b91c1c; border-color:#fecaca; }
    .qb-metrics { margin:8px 0 0; padding:8px 10px; background:var(--soft); border-radius:10px; font-size:.78rem; color:var(--navy); line-height:1.45; }
    @media (max-width:720px) {
      .qb-rail { width:68px; flex-basis:68px; }
      .qb-float.is-open { width:min(320px,calc(100vw - 84px)); }
      .qb-inspector.is-open { width:min(260px,calc(100vw - 84px)); }
    }
  </style>
</head>
<body>
  <aside class="qb-rail" aria-label="Herramientas del plano">
    <a class="logo" href="{{ volver or '/estimado' }}">QB<br>Plano</a>
    <div class="grp">
      <button type="button" data-tool="select" class="is-on" title="Seleccionar">
        <svg viewBox="0 0 24 24"><path d="M4 4l7 16 2-7 7-2z"/></svg>
        Mover
      </button>
    </div>
    <div class="grp">
      <small>Arquitectura</small>
      <button type="button" data-tool="rect" title="Espacio rectangular">
        <svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h16M8 4v16M16 4v16"/></svg>
        Muro
      </button>
      <button type="button" data-tool="space" title="Trazar polígono de espacio">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></svg>
        Espacio
      </button>
      <button type="button" data-tool="opening" title="Apertura de pared">
        <svg viewBox="0 0 24 24"><path d="M4 12h6M14 12h6"/><path d="M10 8v8M14 8v8" stroke-dasharray="2 2"/></svg>
        Apertura
      </button>
    </div>
    <div class="grp">
      <small>Inserción</small>
      <button type="button" data-palette="accesos" title="Accesos">
        <svg viewBox="0 0 24 24"><path d="M5 20V6a2 2 0 0 1 2-2h7l5 5v11"/><path d="M14 4v5h5"/></svg>
        Accesos
      </button>
      <button type="button" data-palette="estructuras" title="Estructuras">
        <svg viewBox="0 0 24 24"><path d="M3 19h18M5 19V10l7-6 7 6v9"/></svg>
        Estructuras
      </button>
      <button type="button" data-tool="note" title="Nota">
        <svg viewBox="0 0 24 24"><path d="M4 20h16M7 16l10-10 3 3-10 10H7z"/></svg>
        Nota
      </button>
    </div>
    <div class="grp" style="margin-top:auto">
      <button type="button" data-tool="delete" title="Quitar elemento">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M8 7l1 12h6l1-12"/></svg>
        Quitar
      </button>
    </div>
  </aside>

  <div class="qb-shell">
    <header class="qb-top">
      <strong>Plano de obra</strong>
      <span class="meta">
        {% if folio %}{{ folio }}{% endif %}
        {% if cliente %} · {{ cliente }}{% endif %}
      </span>
      <span class="grow"></span>
      <span class="status" id="sketch-status">{% if inmutable %}Documento bloqueado.{% else %}Traza un Espacio (polígono) o un recuadro con Muro.{% endif %}</span>
      <button class="btn btn-primary" type="button" id="guardarPlano"{% if inmutable %} disabled{% endif %}>Guardar plano</button>
      <a class="btn" href="{{ volver or '/estimado' }}">Volver</a>
    </header>
    <div class="qb-stage">
      <div id="sketch-board" class="is-select">
        <svg id="planoSvg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="qbGrid" width="12" height="12" patternUnits="userSpaceOnUse">
              <circle cx="1" cy="1" r="0.8" fill="rgba(25,56,95,0.28)"/>
            </pattern>
          </defs>
          <rect id="qbGridFill" fill="url(#qbGrid)" x="0" y="0" width="100%" height="100%"/>
          <g id="qbRooms"></g>
          <g id="qbPreview"></g>
          <g id="qbHandles"></g>
        </svg>
      </div>
      <div class="qb-float" id="paletaFlotante" hidden>
        <header>
          <h2 id="paletaTitulo">Accesos</h2>
          <button type="button" class="close" id="paletaCerrar" aria-label="Cerrar">×</button>
        </header>
        <div class="qb-cards" id="paletaCards"></div>
      </div>
      <aside class="qb-inspector" id="inspector" hidden>
        <h2>Propiedades</h2>
        <label for="propTipo">Elemento</label>
        <input id="propTipo" readonly>
        <label for="propNombre">Nombre</label>
        <input id="propNombre" placeholder="Espacio 1">
        <div class="row">
          <div>
            <label for="propLargo">Largo</label>
            <input id="propLargo" placeholder="8'-0&quot;">
          </div>
          <div>
            <label for="propAncho">Ancho</label>
            <input id="propAncho" placeholder="3'-0&quot;">
          </div>
        </div>
        <div class="qb-metrics" id="propMetricas"></div>
        <div class="actions">
          <button type="button" class="danger" id="propBorrar">Quitar</button>
        </div>
      </aside>
    </div>
  </div>

  <script type="application/json" id="plano-inicial">{{ plano_json|tojson }}</script>
  <script>
    (function(){
      const DOC_ID={{ doc_id|tojson }};
      const INMUTABLE={{ inmutable|tojson }};
      const GRID=12;
      const SNAP=16;
      const WALL_H_FT=8;
      const NS='http://www.w3.org/2000/svg';
      const VANOS={
        'door-hinged':{kind:'door', width:36, height:80, label:'Puerta abatible'},
        'door-folding':{kind:'door', width:60, height:80, label:'Puerta plegable'},
        'door-sliding':{kind:'door', width:72, height:80, label:'Puerta corrediza'},
        'door-double':{kind:'door', width:72, height:80, label:'Puerta doble'},
        'window-operable':{kind:'window', width:36, height:48, label:'Ventana practicable'},
        'window-fixed':{kind:'window', width:36, height:48, label:'Ventana fija'},
        'window-sliding':{kind:'window', width:48, height:48, label:'Ventana corredera'},
        opening:{kind:'opening', width:36, height:96, label:'Apertura de pared'},
        'roof-gable':{kind:'mark', width:120, height:48, label:'Cubierta a dos aguas'},
        'stair-run':{kind:'mark', width:56, height:70, label:'Tramo de escalera'}
      };
      const PALETAS={
        accesos:{
          titulo:'Accesos',
          items:[
            {id:'door-hinged', label:'Puerta abatible'},
            {id:'door-folding', label:'Puerta plegable'},
            {id:'door-sliding', label:'Puerta corrediza'},
            {id:'door-double', label:'Puerta doble'},
            {id:'window-operable', label:'Ventana practicable'},
            {id:'window-fixed', label:'Ventana fija'},
            {id:'window-sliding', label:'Ventana corredera'}
          ]
        },
        estructuras:{
          titulo:'Estructuras',
          items:[
            {id:'roof-gable', label:'Cubierta a dos aguas'},
            {id:'stair-run', label:'Tramo de escalera'}
          ]
        }
      };

      const board=document.getElementById('sketch-board');
      const svg=document.getElementById('planoSvg');
      const gRooms=document.getElementById('qbRooms');
      const gPreview=document.getElementById('qbPreview');
      const gHandles=document.getElementById('qbHandles');
      const status=document.getElementById('sketch-status');
      const saveBtn=document.getElementById('guardarPlano');
      const inspector=document.getElementById('inspector');
      const paleta=document.getElementById('paletaFlotante');
      const paletaCards=document.getElementById('paletaCards');
      const rail=document.querySelector('.qb-rail');

      const model={ rooms:[], notes:[], marks:[] };
      let tool='select';
      let pendingVano=null;
      let polyPts=[];
      let hover=null;
      let drag=null;
      let selected=null;
      let rectOrigin=null;
      let guardando=false;
      let seq=1;

      function uid(pref){ return pref+(seq++); }
      function setStatus(msg, kind){
        if(!status) return;
        status.textContent=msg||'';
        status.className='status'+(kind?' '+kind:'');
      }
      function tokenContratista(){
        try{ return localStorage.getItem('contratista_sesion')||sessionStorage.getItem('contratista_sesion')||''; }catch(_){ return ''; }
      }
      function headersAuth(){
        const headers={'Content-Type':'application/json','Accept':'application/json'};
        const token=tokenContratista();
        if(token) headers.Authorization='Bearer '+token;
        return headers;
      }
      function fmtPies(inches){
        const total=Math.max(0, Math.round(Math.abs(inches)));
        return Math.floor(total/12)+"'-"+(total%12)+'"';
      }
      function parsePies(texto){
        const t=String(texto||'').trim();
        const m=t.match(/(-?\d+)\s*'\s*-?\s*(\d+)?/);
        if(m) return parseInt(m[1],10)*12 + parseInt(m[2]||'0',10);
        const n=parseFloat(t);
        return isFinite(n)? n*12 : null;
      }
      function snapPunto(p, ancla){
        let x=Math.round(p.x/GRID)*GRID;
        let y=Math.round(p.y/GRID)*GRID;
        if(ancla){
          if(Math.abs(x-ancla.x)>=Math.abs(y-ancla.y)) y=ancla.y;
          else x=ancla.x;
        }
        model.rooms.forEach(function(room){
          room.points.forEach(function(pt){
            if(Math.hypot(x-pt.x,y-pt.y)<=SNAP){ x=pt.x; y=pt.y; }
          });
        });
        return {x:x,y:y};
      }
      function puntoEvento(ev){
        const caja=svg.getBoundingClientRect();
        return { x:ev.clientX-caja.left, y:ev.clientY-caja.top };
      }
      function distPuntoSeg(p,a,b){
        const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy;
        if(len2<1) return {x:a.x,y:a.y,t:0,dist:Math.hypot(p.x-a.x,p.y-a.y),len:0,a:a,b:b};
        let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/len2;
        t=Math.max(0, Math.min(1,t));
        const x=a.x+t*dx, y=a.y+t*dy;
        return {x:x,y:y,t:t,dist:Math.hypot(p.x-x,p.y-y),len:Math.sqrt(len2),a:a,b:b};
      }
      function aristas(room){
        const pts=room.points||[];
        const segs=[];
        for(let i=0;i<pts.length;i++) segs.push({ i:i, a:pts[i], b:pts[(i+1)%pts.length] });
        return segs;
      }
      function shoelace(pts){
        let s=0;
        for(let i=0;i<pts.length;i++){
          const a=pts[i], b=pts[(i+1)%pts.length];
          s+=a.x*b.y-b.x*a.y;
        }
        return Math.abs(s)/2;
      }
      function bbox(pts){
        let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
        pts.forEach(function(p){ minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); });
        return {minX:minX,minY:minY,maxX:maxX,maxY:maxY,w:maxX-minX,h:maxY-minY};
      }
      function centro(pts){
        const b=bbox(pts);
        return {x:(b.minX+b.maxX)/2, y:(b.minY+b.maxY)/2};
      }
      function medidasHabitacion(room){
        const pts=room.points||[];
        const areaIn=shoelace(pts);
        let periIn=0;
        aristas(room).forEach(function(s){ periIn+=Math.hypot(s.b.x-s.a.x,s.b.y-s.a.y); });
        let openingsSf=0, doorLf=0;
        (room.openings||[]).forEach(function(op){
          const def=VANOS[op.tipo]||VANOS.opening;
          const wIn=op.width||def.width;
          const hIn=op.height||def.height;
          openingsSf += (wIn/12)*(hIn/12);
          if(def.kind==='door' || def.kind==='opening') doorLf += wIn/12;
        });
        const floor=areaIn/144;
        const peri=periIn/12;
        const wall=peri*WALL_H_FT;
        const wallNet=Math.max(0, wall-openingsSf);
        const box=bbox(pts);
        return {
          id:room.id,
          room_name:room.name,
          name:room.name,
          points:pts,
          length_in:box.w,
          width_in:box.h,
          length_ft:box.w/12,
          width_ft:box.h/12,
          level:room.level||'Main level',
          area_sqft:round2(floor),
          floor_sf:round2(floor),
          ceiling_sf:round2(floor),
          perimeter_lf:round2(peri),
          wall_sf:round2(wall),
          wall_sf_net:round2(wallNet),
          wall_and_ceiling_sf:round2(wallNet+floor),
          trim_lf:round2(Math.max(0, peri-doorLf)),
          cabinets_lf:0,
          openings_sf:round2(openingsSf),
          openings:(room.openings||[]).map(function(op){
            const def=VANOS[op.tipo]||VANOS.opening;
            return {
              id:op.id, tipo:op.tipo, kind:def.kind,
              wall_index:op.wall, t:op.t, width_in:op.width||def.width,
              height_in:op.height||def.height,
              area_sf:round2(((op.width||def.width)/12)*((op.height||def.height)/12))
            };
          })
        };
      }
      function round2(n){ return Math.round((Number(n)||0)*100)/100; }
      function medidasModelo(){
        const rooms=model.rooms.map(medidasHabitacion);
        const totals=rooms.reduce(function(acc,r){
          acc.area_sqft+=r.area_sqft; acc.perimeter_lf+=r.perimeter_lf;
          acc.wall_sf+=r.wall_sf; acc.wall_sf_net+=r.wall_sf_net; acc.openings_sf+=r.openings_sf;
          return acc;
        },{area_sqft:0,perimeter_lf:0,wall_sf:0,wall_sf_net:0,openings_sf:0});
        Object.keys(totals).forEach(function(k){ totals[k]=round2(totals[k]); });
        return { rooms:rooms, totals:totals };
      }

      function svgEl(name, attrs){
        const n=document.createElementNS(NS, name);
        Object.keys(attrs||{}).forEach(function(k){ n.setAttribute(k, attrs[k]); });
        return n;
      }
      function huecosEnArista(room, wallIndex, len){
        return (room.openings||[]).filter(function(op){ return op.wall===wallIndex && (VANOS[op.tipo]||{}).kind!=='mark'; })
          .map(function(op){
            const w=op.width||(VANOS[op.tipo]||VANOS.opening).width;
            const mid=op.t*len;
            return { t0:Math.max(0,(mid-w/2)/len), t1:Math.min(1,(mid+w/2)/len) };
          })
          .sort(function(a,b){ return a.t0-b.t0; });
      }
      function puntoEn(a,b,t){ return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
      function trozosMuro(a,b,huecos){
        const out=[];
        let cursor=0;
        huecos.forEach(function(h){
          if(h.t0>cursor+0.004) out.push([puntoEn(a,b,cursor), puntoEn(a,b,h.t0)]);
          cursor=Math.max(cursor, h.t1);
        });
        if(cursor<0.996) out.push([puntoEn(a,b,cursor), puntoEn(a,b,1)]);
        return out;
      }
      function simboloVano(op, hit){
        const def=VANOS[op.tipo]||VANOS.opening;
        const g=svgEl('g', { class:'qb-vano', 'data-kind':'opening', 'data-id':op.id, transform:'translate('+hit.x+','+hit.y+') rotate('+(hit.angle*180/Math.PI)+')' });
        const h=(op.width||def.width)/2;
        if(def.kind==='window'){
          g.appendChild(svgEl('line', {x1:-h,y1:-6,x2:h,y2:-6,stroke:'#19385f','stroke-width':3}));
          g.appendChild(svgEl('line', {x1:-h,y1:0,x2:h,y2:0,stroke:'#0d47a1','stroke-width':1.6}));
          g.appendChild(svgEl('line', {x1:-h,y1:6,x2:h,y2:6,stroke:'#19385f','stroke-width':3}));
          g.appendChild(svgEl('line', {x1:-h,y1:-6,x2:-h,y2:6,stroke:'#19385f','stroke-width':3}));
          g.appendChild(svgEl('line', {x1:h,y1:-6,x2:h,y2:6,stroke:'#19385f','stroke-width':3}));
        }else if(def.kind==='opening'){
          g.appendChild(svgEl('line', {x1:-h,y1:-8,x2:-h,y2:8,stroke:'#dba72b','stroke-width':3,'stroke-dasharray':'4 3'}));
          g.appendChild(svgEl('line', {x1:h,y1:-8,x2:h,y2:8,stroke:'#dba72b','stroke-width':3,'stroke-dasharray':'4 3'}));
        }else{
          g.appendChild(svgEl('line', {x1:-h,y1:-8,x2:-h,y2:8,stroke:'#19385f','stroke-width':4}));
          g.appendChild(svgEl('line', {x1:h,y1:-8,x2:h,y2:8,stroke:'#19385f','stroke-width':4}));
          if(op.tipo==='door-double'){
            g.appendChild(svgEl('path', {d:'M 0 0 A '+h+' '+h+' 0 0 0 '+(-h)+' '+h, fill:'rgba(13,71,161,.08)', stroke:'#0d47a1','stroke-width':1.5}));
            g.appendChild(svgEl('path', {d:'M 0 0 A '+h+' '+h+' 0 0 1 '+h+' '+h, fill:'rgba(13,71,161,.08)', stroke:'#0d47a1','stroke-width':1.5}));
          }else if(op.tipo==='door-sliding'){
            g.appendChild(svgEl('rect', {x:-h+4,y:-12,width:h,height:8,fill:'#edf5fb',stroke:'#0d47a1'}));
            g.appendChild(svgEl('rect', {x:0,y:4,width:h-4,height:8,fill:'#fff',stroke:'#0d47a1'}));
          }else if(op.tipo==='door-folding'){
            g.appendChild(svgEl('path', {d:'M '+(-h+6)+' 0 l 10 -16 l 10 16 l 10 -16 l 10 16 l 10 -16', fill:'none', stroke:'#0d47a1','stroke-width':1.6}));
          }else{
            g.appendChild(svgEl('line', {x1:-h,y1:0,x2:-h,y2:Math.min(56,op.width||36),stroke:'#0d47a1','stroke-width':2.5}));
            g.appendChild(svgEl('path', {d:'M '+h+' 0 A '+(op.width||36)+' '+(op.width||36)+' 0 0 0 '+(-h)+' '+(op.width||36), fill:'rgba(13,71,161,.08)', stroke:'#0d47a1','stroke-width':1.5}));
          }
        }
        return g;
      }
      function hitArista(room, wallIndex){
        const s=aristas(room)[wallIndex];
        if(!s) return null;
        const len=Math.hypot(s.b.x-s.a.x,s.b.y-s.a.y);
        return { a:s.a, b:s.b, len:len, angle:Math.atan2(s.b.y-s.a.y,s.b.x-s.a.x) };
      }
      function pintar(){
        gRooms.innerHTML='';
        gHandles.innerHTML='';
        model.rooms.forEach(function(room){
          const d=room.points.map(function(p,i){ return (i?'L':'M')+p.x+' '+p.y; }).join(' ')+' Z';
          const fill=svgEl('path', { d:d, class:'qb-room-fill'+(selected&&selected.room===room&&!selected.opening&&!selected.note?' is-on':''), 'data-kind':'room', 'data-id':room.id });
          gRooms.appendChild(fill);
          aristas(room).forEach(function(seg){
            const len=Math.hypot(seg.b.x-seg.a.x, seg.b.y-seg.a.y);
            trozosMuro(seg.a, seg.b, huecosEnArista(room, seg.i, len)).forEach(function(tr){
              gRooms.appendChild(svgEl('line', { x1:tr[0].x, y1:tr[0].y, x2:tr[1].x, y2:tr[1].y, class:'qb-wall' }));
            });
            const mid={x:(seg.a.x+seg.b.x)/2, y:(seg.a.y+seg.b.y)/2};
            const cota=svgEl('text', { x:mid.x, y:mid.y-10, class:'qb-cota', 'text-anchor':'middle' });
            cota.textContent=fmtPies(len);
            gRooms.appendChild(cota);
          });
          const c=centro(room.points);
          const label=svgEl('text', { x:c.x, y:c.y, class:'qb-cota', 'text-anchor':'middle' });
          const m=medidasHabitacion(room);
          label.textContent=room.name+' · '+m.area_sqft+' SF';
          gRooms.appendChild(label);
          (room.openings||[]).forEach(function(op){
            const info=hitArista(room, op.wall);
            if(!info) return;
            const p=puntoEn(info.a, info.b, op.t);
            gRooms.appendChild(simboloVano(op, {x:p.x,y:p.y,angle:info.angle}));
          });
        });
        model.notes.forEach(function(n){
          const t=svgEl('text', { x:n.x, y:n.y, class:'qb-note', 'data-kind':'note', 'data-id':n.id });
          t.textContent=n.text||'Nota';
          gRooms.appendChild(t);
        });
        model.marks.forEach(function(mk){
          const g=svgEl('g', { transform:'translate('+mk.x+','+mk.y+') rotate('+(mk.rot||0)+')', 'data-kind':'mark', 'data-id':mk.id });
          g.appendChild(svgEl('rect', {x:-28,y:-16,width:56,height:32,fill:'#edf5fb',stroke:'#19385f'}));
          const tx=svgEl('text', {x:0,y:4,class:'qb-cota','text-anchor':'middle'});
          tx.textContent=(VANOS[mk.tipo]||{}).label||mk.tipo;
          g.appendChild(tx);
          gRooms.appendChild(g);
        });
        if(selected && selected.room && !selected.opening){
          selected.room.points.forEach(function(p,i){
            const h=svgEl('circle', { cx:p.x, cy:p.y, r:6, class:'qb-handle', 'data-kind':'vertex', 'data-id':selected.room.id, 'data-index':String(i) });
            gHandles.appendChild(h);
          });
        }
      }

      function muroCercano(p){
        let mejor=null;
        model.rooms.forEach(function(room){
          aristas(room).forEach(function(seg){
            const hit=distPuntoSeg(p, seg.a, seg.b);
            if(hit.dist<=SNAP+10 && (!mejor || hit.dist<mejor.dist)){
              mejor={ room:room, wall:seg.i, hit:hit, angle:Math.atan2(seg.b.y-seg.a.y, seg.b.x-seg.a.x) };
            }
          });
        });
        return mejor;
      }
      function espacioEn(p){
        for(let i=model.rooms.length-1;i>=0;i--){
          if(puntoEnPoligono(p, model.rooms[i].points)) return model.rooms[i];
        }
        return null;
      }
      function puntoEnPoligono(p, pts){
        let inPoly=false;
        for(let i=0,j=pts.length-1;i<pts.length;j=i++){
          const a=pts[i], b=pts[j];
          const inter=((a.y>p.y)!==(b.y>p.y)) && (p.x < (b.x-a.x)*(p.y-a.y)/((b.y-a.y)||1)+a.x);
          if(inter) inPoly=!inPoly;
        }
        return inPoly;
      }
      function nuevaHabitacion(pts, nombre){
        const room={ id:uid('r'), name:nombre||('Espacio '+ (model.rooms.length+1)), points:pts, openings:[], level:'Main level' };
        model.rooms.push(room);
        selected={ room:room };
        return room;
      }
      function colocarVano(tipo, p){
        const def=VANOS[tipo];
        if(!def) return;
        if(def.kind==='mark'){
          model.marks.push({ id:uid('k'), tipo:tipo, x:p.x, y:p.y, rot:0 });
          pintar(); return;
        }
        const hallado=muroCercano(p);
        if(!hallado){ setStatus('Suéltalo sobre un muro del espacio.','err'); return; }
        const op={ id:uid('o'), tipo:tipo, wall:hallado.wall, t:hallado.hit.t, width:def.width, height:def.height };
        hallado.room.openings=hallado.room.openings||[];
        hallado.room.openings.push(op);
        selected={ room:hallado.room, opening:op };
        pintar();
        refrescarInspector();
        setStatus(def.label+' encajada. El muro queda abierto en el vano.','ok');
      }

      function aplicarTool(nombre){
        tool=nombre||'select';
        if(nombre!=='opening') pendingVano=null;
        polyPts=[]; hover=null; rectOrigin=null;
        gPreview.innerHTML='';
        board.className=tool==='select'?'is-select':(tool==='delete'?'is-delete':(tool==='note'?'is-note':'is-draw'));
        document.querySelectorAll('.qb-rail [data-tool]').forEach(function(btn){ btn.classList.toggle('is-on', btn.dataset.tool===tool); });
        document.querySelectorAll('.qb-rail [data-palette]').forEach(function(btn){ btn.classList.remove('is-on'); });
        const ayudas={
          select:'Selecciona un espacio, un vértice o un vano.',
          space:'Espacio: pulsa vértices. Cierra en el primero o con Enter.',
          rect:'Muro: arrastra un recuadro; se crea el espacio de 4 muros.',
          opening:'Apertura: toca un muro para abrir el vano.',
          note:'Nota: toca el plano para escribir.',
          delete:'Toca un espacio, vano o nota para quitarlo.'
        };
        setStatus(ayudas[tool]||ayudas.select);
      }
      window.qbSketchHerramienta=aplicarTool;

      function refrescarInspector(){
        if(!selected){ inspector.hidden=true; inspector.classList.remove('is-open'); return; }
        inspector.hidden=false; inspector.classList.add('is-open');
        const nombre=document.getElementById('propNombre');
        const tipo=document.getElementById('propTipo');
        const largo=document.getElementById('propLargo');
        const ancho=document.getElementById('propAncho');
        const met=document.getElementById('propMetricas');
        if(selected.opening){
          const def=VANOS[selected.opening.tipo]||VANOS.opening;
          tipo.value=def.label;
          nombre.value=selected.room.name;
          largo.value=fmtPies(selected.opening.width||def.width);
          ancho.value=fmtPies(selected.opening.height||def.height);
          met.textContent='El vano recorta el muro. Área descontada: '+round2(((selected.opening.width||def.width)/12)*((selected.opening.height||def.height)/12))+' SF.';
        }else if(selected.note){
          tipo.value='Nota';
          nombre.value=selected.note.text||'Nota';
          largo.value=''; ancho.value='';
          met.textContent='';
        }else if(selected.room){
          const m=medidasHabitacion(selected.room);
          tipo.value='Espacio';
          nombre.value=selected.room.name;
          largo.value=fmtPies(m.length_in);
          ancho.value=fmtPies(m.width_in);
          met.textContent='Área '+m.area_sqft+' SF · Perímetro '+m.perimeter_lf+' LF · Muros '+m.wall_sf_net+' SF (neto, altura 8\')';
        }
      }
      function aplicarMedida(){
        if(!selected) return;
        if(selected.opening){
          const w=parsePies(document.getElementById('propLargo').value);
          const h=parsePies(document.getElementById('propAncho').value);
          if(w) selected.opening.width=w;
          if(h) selected.opening.height=h;
        }else if(selected.note){
          selected.note.text=document.getElementById('propNombre').value||'Nota';
        }else if(selected.room){
          selected.room.name=document.getElementById('propNombre').value||selected.room.name;
          const w=parsePies(document.getElementById('propLargo').value);
          const h=parsePies(document.getElementById('propAncho').value);
          if(w && h && selected.room.points.length===4){
            const b=bbox(selected.room.points);
            const ox=b.minX, oy=b.minY;
            selected.room.points=[{x:ox,y:oy},{x:ox+w,y:oy},{x:ox+w,y:oy+h},{x:ox,y:oy+h}];
          }
        }
        pintar();
        refrescarInspector();
      }
      function quitarSeleccionado(){
        if(!selected) return;
        if(selected.opening && selected.room){
          selected.room.openings=(selected.room.openings||[]).filter(function(o){ return o.id!==selected.opening.id; });
        }else if(selected.note){
          model.notes=model.notes.filter(function(n){ return n.id!==selected.note.id; });
        }else if(selected.mark){
          model.marks=model.marks.filter(function(n){ return n.id!==selected.mark.id; });
        }else if(selected.room){
          model.rooms=model.rooms.filter(function(r){ return r.id!==selected.room.id; });
        }
        selected=null;
        pintar();
        refrescarInspector();
      }

      function cerrarPoligono(){
        if(polyPts.length<3){ setStatus('Haz al menos 3 vértices para cerrar el espacio.'); return; }
        nuevaHabitacion(polyPts.slice());
        polyPts=[]; hover=null; gPreview.innerHTML='';
        pintar(); refrescarInspector();
        setStatus('Espacio cerrado. Área y perímetro listos para el estimado.','ok');
        aplicarTool('select');
      }
      function pintarPreview(){
        gPreview.innerHTML='';
        if(tool==='space' && polyPts.length){
          const pts=polyPts.concat(hover?[hover]:[]);
          const d=pts.map(function(p,i){ return (i?'L':'M')+p.x+' '+p.y; }).join(' ');
          gPreview.appendChild(svgEl('path', { d:d, class:'qb-preview' }));
          if(pts.length>1){
            const a=pts[pts.length-2], b=pts[pts.length-1];
            const t=svgEl('text', { x:(a.x+b.x)/2, y:(a.y+b.y)/2-8, class:'qb-cota', 'text-anchor':'middle' });
            t.textContent=fmtPies(Math.hypot(b.x-a.x,b.y-a.y));
            gPreview.appendChild(t);
          }
        }else if(tool==='rect' && rectOrigin && hover){
          const x=Math.min(rectOrigin.x,hover.x), y=Math.min(rectOrigin.y,hover.y);
          const w=Math.abs(hover.x-rectOrigin.x), h=Math.abs(hover.y-rectOrigin.y);
          gPreview.appendChild(svgEl('rect', { x:x, y:y, width:Math.max(1,w), height:Math.max(1,h), class:'qb-preview' }));
          const t=svgEl('text', { x:x+w/2, y:y-8, class:'qb-cota', 'text-anchor':'middle' });
          t.textContent=fmtPies(w)+' × '+fmtPies(h);
          gPreview.appendChild(t);
        }
      }

      function alPunteroAbajo(ev){
        if(INMUTABLE) return;
        if(ev.target.closest && (ev.target.closest('.qb-float')||ev.target.closest('.qb-inspector')||ev.target.closest('.qb-rail')||ev.target.closest('.qb-top')||ev.target.closest('#qb-soporte'))) return;
        if(ev.pointerType==='mouse' && ev.button!==0) return;
        const crudo=puntoEvento(ev);
        const p=snapPunto(crudo, tool==='rect' && rectOrigin ? rectOrigin : null);
        if(tool==='space'){
          ev.preventDefault();
          if(polyPts.length>=3 && Math.hypot(p.x-polyPts[0].x,p.y-polyPts[0].y)<=SNAP){ cerrarPoligono(); return; }
          polyPts.push(p); hover=p; pintarPreview();
          setStatus('Vértice '+(polyPts.length)+'. Cierra en el primero o pulsa Enter.');
          return;
        }
        if(tool==='rect'){
          ev.preventDefault();
          rectOrigin=p; hover=p; drag={kind:'rect'};
          try{ board.setPointerCapture(ev.pointerId); }catch(_){}
          return;
        }
        if(tool==='opening' || pendingVano){
          ev.preventDefault();
          colocarVano(pendingVano||'opening', p);
          pendingVano=null;
          aplicarTool('select');
          return;
        }
        if(tool==='note'){
          model.notes.push({ id:uid('n'), x:p.x, y:p.y, text:'Nota' });
          selected={ note:model.notes[model.notes.length-1] };
          pintar(); refrescarInspector(); aplicarTool('select');
          return;
        }
        if(tool==='delete'){
          const hit=hitSeleccion(crudo);
          if(hit){ selected=hit; quitarSeleccionado(); }
          return;
        }
        const h=ev.target.closest && ev.target.closest('.qb-handle');
        if(h){
          const room=model.rooms.filter(function(r){ return r.id===h.getAttribute('data-id'); })[0];
          drag={ kind:'vertex', room:room, index:parseInt(h.getAttribute('data-index'),10) };
          try{ board.setPointerCapture(ev.pointerId); }catch(_){}
          return;
        }
        const hit=hitSeleccion(crudo);
        selected=hit;
        if(hit && hit.opening){
          drag={ kind:'opening', room:hit.room, opening:hit.opening };
          try{ board.setPointerCapture(ev.pointerId); }catch(_){}
        }else if(hit && hit.room){
          drag={ kind:'room', room:hit.room, ox:crudo.x, oy:crudo.y, pts:hit.room.points.map(function(pt){ return {x:pt.x,y:pt.y}; }) };
          try{ board.setPointerCapture(ev.pointerId); }catch(_){}
        }else if(hit && hit.note){
          drag={ kind:'note', note:hit.note, ox:crudo.x-hit.note.x, oy:crudo.y-hit.note.y };
          try{ board.setPointerCapture(ev.pointerId); }catch(_){}
        }
        pintar(); refrescarInspector();
      }
      function hitSeleccion(p){
        for(let i=model.notes.length-1;i>=0;i--){
          if(Math.hypot(p.x-model.notes[i].x,p.y-model.notes[i].y)<16) return { note:model.notes[i] };
        }
        for(let r=model.rooms.length-1;r>=0;r--){
          const room=model.rooms[r];
          for(let o=0;o<(room.openings||[]).length;o++){
            const op=room.openings[o];
            const info=hitArista(room, op.wall);
            if(!info) continue;
            const q=puntoEn(info.a, info.b, op.t);
            if(Math.hypot(p.x-q.x,p.y-q.y)<(op.width||24)/2+8) return { room:room, opening:op };
          }
          if(puntoEnPoligono(p, room.points)) return { room:room };
        }
        return null;
      }
      function alPunteroMueve(ev){
        const crudo=puntoEvento(ev);
        if(tool==='space' && polyPts.length){
          hover=snapPunto(crudo);
          pintarPreview(); return;
        }
        if(tool==='rect' && rectOrigin){
          hover=snapPunto(crudo, rectOrigin);
          pintarPreview(); return;
        }
        if(!drag) return;
        ev.preventDefault();
        if(drag.kind==='vertex' && drag.room){
          drag.room.points[drag.index]=snapPunto(crudo);
        }else if(drag.kind==='room' && drag.room){
          const dx=crudo.x-drag.ox, dy=crudo.y-drag.oy;
          drag.room.points=drag.pts.map(function(pt){ return {x:pt.x+dx, y:pt.y+dy}; });
        }else if(drag.kind==='opening' && drag.opening){
          const hallado=muroCercano(crudo);
          if(hallado && hallado.room===drag.room){
            drag.opening.wall=hallado.wall;
            drag.opening.t=hallado.hit.t;
          }
        }else if(drag.kind==='note' && drag.note){
          drag.note.x=crudo.x-drag.ox; drag.note.y=crudo.y-drag.oy;
        }
        pintar(); refrescarInspector();
      }
      function alPunteroArriba(ev){
        if(tool==='rect' && rectOrigin){
          const p=snapPunto(puntoEvento(ev), rectOrigin);
          const x=Math.min(rectOrigin.x,p.x), y=Math.min(rectOrigin.y,p.y);
          const w=Math.abs(p.x-rectOrigin.x), h=Math.abs(p.y-rectOrigin.y);
          rectOrigin=null; hover=null; drag=null; gPreview.innerHTML='';
          if(w>=GRID && h>=GRID){
            nuevaHabitacion([{x:x,y:y},{x:x+w,y:y},{x:x+w,y:y+h},{x:x,y:y+h}]);
            pintar(); refrescarInspector();
            setStatus('Espacio rectangular creado. Área y perímetro listos.','ok');
            aplicarTool('select');
          }
          return;
        }
        drag=null;
      }

      board.addEventListener('pointerdown', alPunteroAbajo, true);
      board.addEventListener('pointermove', alPunteroMueve, true);
      board.addEventListener('pointerup', alPunteroArriba, true);
      board.addEventListener('pointercancel', function(){ drag=null; rectOrigin=null; });
      board.addEventListener('dblclick', function(ev){
        if(tool==='space' && polyPts.length>=3){ ev.preventDefault(); cerrarPoligono(); }
      });

      if(rail){
        rail.addEventListener('click', function(ev){
          const btn=ev.target.closest('[data-tool],[data-palette]');
          if(!btn) return;
          ev.preventDefault();
          if(btn.dataset.palette){
            aplicarTool('select');
            rail.querySelectorAll('[data-palette]').forEach(function(b){ b.classList.toggle('is-on', b===btn); });
            const def=PALETAS[btn.dataset.palette];
            if(!def) return;
            document.getElementById('paletaTitulo').textContent=def.titulo;
            paletaCards.innerHTML=def.items.map(function(it){
              return '<button type="button" class="qb-card" data-insert="'+it.id+'">'+it.label+'</button>';
            }).join('');
            paleta.hidden=false; paleta.classList.add('is-open');
            return;
          }
          aplicarTool(btn.dataset.tool);
        });
      }
      document.getElementById('paletaCerrar').addEventListener('click', function(){ paleta.classList.remove('is-open'); paleta.hidden=true; });
      paletaCards.addEventListener('click', function(ev){
        const card=ev.target.closest('[data-insert]');
        if(!card) return;
        pendingVano=card.dataset.insert;
        paleta.classList.remove('is-open'); paleta.hidden=true;
        if((VANOS[pendingVano]||{}).kind==='mark'){
          const caja=svg.getBoundingClientRect();
          colocarVano(pendingVano, {x:caja.width/2, y:caja.height/2});
          pendingVano=null;
          aplicarTool('select');
        }else{
          aplicarTool('opening');
          setStatus('Toca el muro donde va '+((VANOS[pendingVano]||{}).label||'el vano')+'.');
        }
      });
      document.getElementById('propNombre').addEventListener('change', aplicarMedida);
      document.getElementById('propLargo').addEventListener('change', aplicarMedida);
      document.getElementById('propAncho').addEventListener('change', aplicarMedida);
      document.getElementById('propBorrar').addEventListener('click', quitarSeleccionado);
      document.addEventListener('keydown', function(ev){
        if(ev.key==='Enter' && tool==='space'){ ev.preventDefault(); cerrarPoligono(); }
        if(ev.key==='Escape'){
          polyPts=[]; rectOrigin=null; hover=null; gPreview.innerHTML='';
          if(tool!=='select') aplicarTool('select');
        }
        if(INMUTABLE) return;
        if((ev.key==='Delete'||ev.key==='Backspace') && selected){
          const t=ev.target;
          if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
          ev.preventDefault(); quitarSeleccionado();
        }
      });

      function exportarJson(){
        const med=medidasModelo();
        return {
          version:2,
          engine:'qb-room-first',
          scale:{ px_per_inch:1, wall_height_ft:WALL_H_FT },
          rooms:med.rooms,
          notes:model.notes,
          marks:model.marks,
          medidas:med,
          totals:med.totals
        };
      }
      function exportarImagen(){
        const w=Math.max(320, svg.clientWidth||0);
        const h=Math.max(320, svg.clientHeight||0);
        const clone=svg.cloneNode(true);
        clone.setAttribute('width', String(w));
        clone.setAttribute('height', String(h));
        clone.setAttribute('viewBox', '0 0 '+w+' '+h);
        const xml=new XMLSerializer().serializeToString(clone);
        const img=new Image();
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        return new Promise(function(resolve){
          img.onload=function(){
            ctx.fillStyle='#eef2f6';
            ctx.fillRect(0,0,w,h);
            ctx.drawImage(img,0,0);
            let out=canvas.toDataURL('image/png');
            if(out.length>1200000) out=canvas.toDataURL('image/jpeg',0.82);
            resolve(out);
          };
          img.onerror=function(){ resolve(''); };
          img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
        });
      }
      async function guardar(){
        if(guardando) return;
        if(INMUTABLE){ setStatus('Este documento no se puede editar.','err'); return; }
        if(!DOC_ID){ setStatus('Falta el documento.','err'); return; }
        guardando=true;
        try{
          if(saveBtn) saveBtn.disabled=true;
          setStatus('Guardando plano y medidas...');
          const json=exportarJson();
          const imagen=await exportarImagen();
          const res=await fetch('/api/proyecto/'+encodeURIComponent(DOC_ID)+'/sketch',{
            method:'POST', credentials:'same-origin', headers:headersAuth(),
            body:JSON.stringify({ json:json, imagen:imagen, aplicar_medidas:true })
          });
          const body=await res.json().catch(function(){ return {}; });
          if(!res.ok) throw new Error(body.error||'No se pudo guardar el plano.');
          const n=(body.medidas&&body.medidas.rooms||json.rooms||[]).length;
          setStatus('Plano guardado. '+n+' espacio(s) listos para el estimado.','ok');
        }catch(err){
          setStatus(err.message||'No se pudo guardar el plano.','err');
        }finally{
          guardando=false;
          if(saveBtn && !INMUTABLE) saveBtn.disabled=false;
        }
      }
      window.qbSketchGuardar=guardar;
      if(saveBtn) saveBtn.addEventListener('click', function(ev){ ev.preventDefault(); guardar(); });

      function cargarInicial(){
        let bruto=null;
        try{ bruto=JSON.parse(document.getElementById('plano-inicial').textContent||'null'); }catch(_){ bruto=null; }
        if(!bruto || typeof bruto!=='object' || Array.isArray(bruto)) return;
        if(bruto.engine!=='qb-room-first' && Array.isArray(bruto.objects)){
          setStatus('El plano anterior era de líneas. Trázalo de nuevo como espacios.');
          return;
        }
        const rooms=bruto.rooms||[];
        rooms.forEach(function(r){
          if(!r || !Array.isArray(r.points) || r.points.length<3) return;
          model.rooms.push({
            id:r.id||uid('r'),
            name:r.name||r.room_name||('Espacio '+(model.rooms.length+1)),
            level:r.level||r.nivel||'Main level',
            points:r.points.map(function(p){ return {x:Number(p.x)||0, y:Number(p.y)||0}; }),
            openings:(r.openings||[]).map(function(op){
              return { id:op.id||uid('o'), tipo:op.tipo, wall:op.wall_index!=null?op.wall_index:op.wall, t:Number(op.t)||0.5, width:op.width_in||op.width, height:op.height_in||op.height };
            })
          });
        });
        model.notes=Array.isArray(bruto.notes)?bruto.notes:[];
        model.marks=Array.isArray(bruto.marks)?bruto.marks:[];
      }

      cargarInicial();
      aplicarTool('select');
      pintar();
      window.addEventListener('resize', pintar);
      window.qbSketchModelo=function(){ return exportarJson(); };
      window.qbSketchCrearEspacio=function(pts, nombre){
        const room=nuevaHabitacion((pts||[]).map(function(p){ return {x:p.x,y:p.y}; }), nombre);
        pintar(); refrescarInspector();
        return medidasHabitacion(room);
      };
      window.qbSketchColocarVano=function(tipo, x, y){
        colocarVano(tipo, {x:x, y:y});
        return exportarJson();
      };
    })();
  </script>
